openapi: 3.0.3
info:
  title: JMeter Training App API
  description: >
    A simple task management API designed as a target for JMeter performance
    testing training. Includes intentionally slow and flaky endpoints to
    practice load testing, error handling, and assertions.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Native (local)
  - url: http://localhost
    description: Docker (via nginx)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          example: 1
        description:
          type: string
          maxLength: 200
          example: Review quarterly budget report
        due_date:
          type: string
          format: date
          example: "2026-12-31"
        status:
          type: string
          enum: [active, completed]
          example: active
        created_at:
          type: string
          format: date-time
          example: "2026-01-15T10:30:00.000Z"

    Error:
      type: object
      properties:
        error:
          type: boolean
          example: true
        message:
          type: string
          example: Internal server error

paths:

  # ── Health ──────────────────────────────────────────────────────────────────

  /health:
    get:
      summary: Health check
      description: Returns the health status of the application. Run this first to confirm the app is up before starting a load test.
      tags: [Utility]
      responses:
        "200":
          description: App is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ── Auth ────────────────────────────────────────────────────────────────────

  /api/auth/csrf:
    get:
      summary: Get CSRF token
      description: >
        Returns a one-time CSRF token that must be included in the login request.
        Token expires after 5 minutes. This endpoint is designed to teach
        correlation — students must extract the token and pass it to /login.
      tags: [Auth]
      responses:
        "200":
          description: CSRF token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                    example: a1b2c3d4e5f6...

  /api/auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account. Username must be unique and max 100 characters.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 100
                  example: perf_user_1
                password:
                  type: string
                  example: TestPass123!
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account created successfully
        "400":
          description: Missing fields or username too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      summary: Login
      description: >
        Authenticates a user and returns a JWT token. **Requires a valid CSRF
        token** obtained from `/api/auth/csrf`. Pass the JWT token as
        `Authorization: Bearer <token>` on all protected endpoints.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, csrfToken]
              properties:
                username:
                  type: string
                  example: user1
                password:
                  type: string
                  example: password1
                csrfToken:
                  type: string
                  description: One-time token from /api/auth/csrf
                  example: a1b2c3d4e5f6...
      responses:
        "200":
          description: Login successful — use the returned token for protected endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: user1
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid or missing CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Tasks ───────────────────────────────────────────────────────────────────

  /api/tasks:
    get:
      summary: List tasks
      description: Returns a paginated list of tasks belonging to the authenticated user. 20 tasks per page.
      tags: [Tasks]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number (20 tasks per page)
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create a task
      description: Creates a new task for the authenticated user.
      tags: [Tasks]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, due_date]
              properties:
                description:
                  type: string
                  maxLength: 200
                  example: Review quarterly budget report
                due_date:
                  type: string
                  format: date
                  example: "2026-12-31"
                status:
                  type: string
                  enum: [active, completed]
                  default: active
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tasks/{id}:
    get:
      summary: Get a task
      description: Returns a single task by ID. Only returns tasks belonging to the authenticated user.
      tags: [Tasks]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Task found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Update a task
      description: Updates description, due date, and/or status of an existing task.
      tags: [Tasks]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, due_date, status]
              properties:
                description:
                  type: string
                  maxLength: 200
                  example: Updated task description
                due_date:
                  type: string
                  format: date
                  example: "2026-12-31"
                status:
                  type: string
                  enum: [active, completed]
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a task
      description: Permanently deletes a task. Only tasks belonging to the authenticated user can be deleted.
      tags: [Tasks]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Task deleted
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Utility ─────────────────────────────────────────────────────────────────

  /api/slow:
    get:
      summary: Slow endpoint
      description: >
        Waits for the specified number of milliseconds before responding.
        Use this to simulate latency and practice JMeter response time
        assertions and timeouts. Maximum delay is 10 000 ms.
      tags: [Utility]
      parameters:
        - in: query
          name: delay
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
          description: Milliseconds to wait before responding
      responses:
        "200":
          description: Response after the specified delay
          content:
            application/json:
              schema:
                type: object
                properties:
                  delayed:
                    type: integer
                    example: 2000

  /api/flaky:
    get:
      summary: Flaky endpoint
      description: >
        Randomly returns an error based on the configured error rate.
        Use this to practice JMeter error threshold configuration, response
        assertions on error bodies, and handling of varied HTTP status codes.
        Requires authentication.
      tags: [Utility]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: error_rate
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 50
          description: >
            Percentage chance (0–100) that the request will fail.
            Invalid or out-of-range values default to 100 (always fails).
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  error_rate:
                    type: integer
                    example: 30
        "429":
          description: Simulated rate limit error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Simulated internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Simulated service unavailable error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/reset-and-reseed:
    post:
      summary: Reset and reseed database
      description: >
        **Warning: destructive.** Deletes all users and tasks, then re-creates
        5 seed users (user1–user5 / password1–password5) each with 5 tasks.
        Use this to restore a clean state between JMeter test runs.
      tags: [Utility]
      responses:
        "200":
          description: Database reset and reseeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Database reset and reseeded successfully
        "500":
          description: Reset failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
