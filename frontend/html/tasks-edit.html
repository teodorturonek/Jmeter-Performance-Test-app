<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - Edit Task</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">Tasks</span>
      <div>
        <span class="text-light me-3" id="usernameDisplay"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2>Edit Task</h2>

    <div id="error" class="text-danger mb-3" style="display:none;"></div>

    <div class="card">
      <div class="card-body">
        <form id="editTaskForm">
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <input type="text" class="form-control" id="description" maxlength="200" required>
            <div class="form-text">Max 200 characters</div>
          </div>
          <div class="mb-3">
            <label for="dueDate" class="form-label">Due Date (dd/mm/yyyy)</label>
            <input type="text" class="form-control" id="dueDate" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Status</label>
            <div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="status" id="statusActive" value="active">
                <label class="form-check-label" for="statusActive">Active</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="status" id="statusCompleted" value="completed">
                <label class="form-check-label" for="statusCompleted">Completed</label>
              </div>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-danger" onclick="deleteTask()">Delete</button>
            <a href="/tasks" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Not authenticated');

    const user = getUser();
    document.getElementById('usernameDisplay').textContent = user ? user.username : '';

    // Extract task ID from URL: /tasks/123/edit
    const pathParts = window.location.pathname.split('/');
    const taskId = pathParts[2];

    async function loadTask() {
      try {
        const res = await apiFetch('/tasks/' + taskId);
        if (!res.ok) {
          const data = await res.json();
          showError('error', data.message);
          return;
        }

        const task = await res.json();
        document.getElementById('description').value = task.description;
        document.getElementById('dueDate').value = toDisplayDate(task.due_date);

        if (task.status === 'completed') {
          document.getElementById('statusCompleted').checked = true;
        } else {
          document.getElementById('statusActive').checked = true;
        }
      } catch (err) {
        showError('error', 'Failed to load task');
      }
    }

    document.getElementById('editTaskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError('error');

      const description = document.getElementById('description').value;
      const dueDateRaw = document.getElementById('dueDate').value;
      const status = document.querySelector('input[name="status"]:checked').value;

      const dueDate = toISODate(dueDateRaw);

      try {
        const res = await apiFetch('/tasks/' + taskId, {
          method: 'PUT',
          body: JSON.stringify({ description, due_date: dueDate, status }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError('error', data.message);
          return;
        }

        window.location.href = '/tasks';
      } catch (err) {
        showError('error', 'Failed to update task');
      }
    });

    async function deleteTask() {
      try {
        const res = await apiFetch('/tasks/' + taskId, { method: 'DELETE' });
        if (!res.ok) {
          const data = await res.json();
          showError('error', data.message);
          return;
        }
        window.location.href = '/tasks';
      } catch (err) {
        showError('error', 'Failed to delete task');
      }
    }

    loadTask();
  </script>
</body>
</html>
