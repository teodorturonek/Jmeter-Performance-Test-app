<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - My Tasks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">Tasks</span>
      <div>
        <span class="text-light me-3" id="usernameDisplay"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>My Tasks</h2>
      <a href="/tasks/new" class="btn btn-primary">Add New Task</a>
    </div>

    <div id="error" class="text-danger mb-3" style="display:none;"></div>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>Description</th>
          <th>Due Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="taskList">
      </tbody>
    </table>

    <nav id="pagination" style="display:none;">
      <ul class="pagination justify-content-center">
        <li class="page-item" id="prevPage">
          <a class="page-link" href="#" onclick="changePage(-1)">Previous</a>
        </li>
        <li class="page-item disabled">
          <span class="page-link" id="pageInfo"></span>
        </li>
        <li class="page-item" id="nextPage">
          <a class="page-link" href="#" onclick="changePage(1)">Next</a>
        </li>
      </ul>
    </nav>
  </div>

  <script src="/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Not authenticated');

    const user = getUser();
    document.getElementById('usernameDisplay').textContent = user ? user.username : '';

    let currentPage = parseInt(new URLSearchParams(window.location.search).get('page')) || 1;

    async function loadTasks() {
      hideError('error');
      try {
        const res = await apiFetch('/tasks?page=' + currentPage);
        if (!res.ok) {
          const data = await res.json();
          showError('error', data.message);
          return;
        }

        const tasks = await res.json();
        const tbody = document.getElementById('taskList');
        tbody.innerHTML = '';

        if (tasks.length === 0 && currentPage === 1) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No tasks yet. Click "Add New Task" to get started.</td></tr>';
        }

        tasks.forEach(task => {
          const tr = document.createElement('tr');
          const statusBadge = task.status === 'active'
            ? '<span class="badge bg-primary">Active</span>'
            : '<span class="badge bg-success">Completed</span>';

          tr.innerHTML =
            '<td>' + escapeHtml(task.description) + '</td>' +
            '<td>' + toDisplayDate(task.due_date) + '</td>' +
            '<td>' + statusBadge + '</td>' +
            '<td>' +
              '<a href="/tasks/' + task.id + '/edit" class="btn btn-sm btn-outline-secondary me-1">Edit</a>' +
              '<button class="btn btn-sm btn-outline-danger" onclick="deleteTask(' + task.id + ')">Delete</button>' +
            '</td>';
          tbody.appendChild(tr);
        });

        // Pagination controls
        const pagination = document.getElementById('pagination');
        if (tasks.length === 20 || currentPage > 1) {
          pagination.style.display = 'block';
          document.getElementById('pageInfo').textContent = 'Page ' + currentPage;
          document.getElementById('prevPage').classList.toggle('disabled', currentPage <= 1);
          document.getElementById('nextPage').classList.toggle('disabled', tasks.length < 20);
        } else {
          pagination.style.display = 'none';
        }
      } catch (err) {
        showError('error', 'Failed to load tasks');
      }
    }

    function changePage(delta) {
      const newPage = currentPage + delta;
      if (newPage < 1) return;
      currentPage = newPage;
      window.history.replaceState(null, '', '/tasks?page=' + currentPage);
      loadTasks();
    }

    async function deleteTask(id) {
      try {
        const res = await apiFetch('/tasks/' + id, { method: 'DELETE' });
        if (!res.ok) {
          const data = await res.json();
          showError('error', data.message);
          return;
        }
        loadTasks();
      } catch (err) {
        showError('error', 'Failed to delete task');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadTasks();
  </script>
</body>
</html>
