<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Testing Demo - My Tasks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%) !important; }
    .navbar-brand img { height: 30px; margin-right: 10px; }
    .btn-primary { background: #e63946; border-color: #e63946; }
    .btn-primary:hover { background: #c1121f; border-color: #c1121f; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark">
    <div class="container">
      <span class="navbar-brand d-flex align-items-center">
        <img src="/kainos_logo.jpg" alt="Logo" style="height:30px;border-radius:4px;">
        Performance Testing Demo App
      </span>
      <div>
        <span class="text-light me-3" id="usernameDisplay"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>My Tasks</h2>
      <a href="/tasks/new" class="btn btn-primary">Add New Task</a>
    </div>

    <div class="mb-3">
      <div class="input-group">
        <input type="text" id="searchInput" class="form-control" placeholder="Search by Task ID or description...">
        <button class="btn btn-outline-secondary" onclick="searchTasks()">Search</button>
        <button class="btn btn-outline-secondary" onclick="clearSearch()">Clear</button>
      </div>
    </div>

    <div id="error" class="text-danger mb-3" style="display:none;"></div>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>Task ID</th>
          <th>Description</th>
          <th>Due Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="taskList">
      </tbody>
    </table>

    <nav id="pagination" style="display:none;">
      <ul class="pagination justify-content-center">
        <li class="page-item" id="prevPage">
          <a class="page-link" href="#" onclick="changePage(-1)">Previous</a>
        </li>
        <li class="page-item disabled">
          <span class="page-link" id="pageInfo"></span>
        </li>
        <li class="page-item" id="nextPage">
          <a class="page-link" href="#" onclick="changePage(1)">Next</a>
        </li>
      </ul>
    </nav>
  </div>

  <script src="/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Not authenticated');

    const user = getUser();
    document.getElementById('usernameDisplay').textContent = user ? user.username : '';

    let currentPage = parseInt(new URLSearchParams(window.location.search).get('page')) || 1;

    async function loadTasks() {
      hideError('error');
      try {
        const res = await apiFetch('/tasks?page=' + currentPage);
        if (!res.ok) {
          const data = await res.json();
          showError('error', data.message);
          return;
        }

        const tasks = await res.json();
        const tbody = document.getElementById('taskList');
        tbody.innerHTML = '';

        if (tasks.length === 0 && currentPage === 1) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No tasks yet. Click "Add New Task" to get started.</td></tr>';
        }

        tasks.forEach(task => {
          const tr = document.createElement('tr');
          const statusBadge = task.status === 'active'
            ? '<span class="badge bg-primary">Active</span>'
            : '<span class="badge bg-success">Completed</span>';

          tr.innerHTML =
            '<td><code>' + escapeHtml(task.task_id) + '</code></td>' +
            '<td>' + escapeHtml(task.description) + '</td>' +
            '<td>' + toDisplayDate(task.due_date) + '</td>' +
            '<td>' + statusBadge + '</td>' +
            '<td>' +
              '<a href="/tasks/' + task.task_id + '/edit" class="btn btn-sm btn-outline-secondary me-1">Edit</a>' +
              '<button class="btn btn-sm btn-outline-danger" onclick="deleteTask(\'' + task.task_id + '\')">Delete</button>' +
            '</td>';
          tbody.appendChild(tr);
        });

        // Pagination controls
        const pagination = document.getElementById('pagination');
        if (tasks.length === 20 || currentPage > 1) {
          pagination.style.display = 'block';
          document.getElementById('pageInfo').textContent = 'Page ' + currentPage;
          document.getElementById('prevPage').classList.toggle('disabled', currentPage <= 1);
          document.getElementById('nextPage').classList.toggle('disabled', tasks.length < 20);
        } else {
          pagination.style.display = 'none';
        }
      } catch (err) {
        showError('error', 'Failed to load tasks');
      }
    }

    function changePage(delta) {
      const newPage = currentPage + delta;
      if (newPage < 1) return;
      currentPage = newPage;
      window.history.replaceState(null, '', '/tasks?page=' + currentPage);
      loadTasks();
    }

    async function deleteTask(taskId) {
      try {
        const res = await apiFetch('/tasks/' + taskId, { method: 'DELETE' });
        if (!res.ok) {
          const data = await res.json();
          showError('error', data.message);
          return;
        }
        loadTasks();
      } catch (err) {
        showError('error', 'Failed to delete task');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function searchTasks() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) { loadTasks(); return; }
      hideError('error');
      try {
        const res = await apiFetch('/tasks/search?q=' + encodeURIComponent(query));
        if (!res.ok) { showError('error', (await res.json()).message); return; }
        const tasks = await res.json();
        const tbody = document.getElementById('taskList');
        tbody.innerHTML = '';
        if (tasks.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No tasks found.</td></tr>';
        }
        tasks.forEach(task => {
          const tr = document.createElement('tr');
          const statusBadge = task.status === 'active' ? '<span class="badge bg-primary">Active</span>' : '<span class="badge bg-success">Completed</span>';
          tr.innerHTML = '<td><code>' + escapeHtml(task.task_id) + '</code></td><td>' + escapeHtml(task.description) + '</td><td>' + toDisplayDate(task.due_date) + '</td><td>' + statusBadge + '</td><td><a href="/tasks/' + task.task_id + '/edit" class="btn btn-sm btn-outline-secondary me-1">Edit</a><button class="btn btn-sm btn-outline-danger" onclick="deleteTask(\'' + task.task_id + '\')">Delete</button></td>';
          tbody.appendChild(tr);
        });
        document.getElementById('pagination').style.display = 'none';
      } catch (err) { showError('error', 'Search failed'); }
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      loadTasks();
    }

    document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') searchTasks(); });

    loadTasks();
  </script>
</body>
</html>
