<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Testing Demo App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
    }
    .top-logo {
      position: absolute;
      top: 20px;
      left: 20px;
    }
    .top-logo img {
      height: 40px;
      border-radius: 6px;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    .app-title {
      color: #fff;
      font-weight: 300;
      letter-spacing: 1px;
    }
    .app-subtitle {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
    }
    .btn-primary {
      background: #e63946;
      border-color: #e63946;
    }
    .btn-primary:hover {
      background: #c1121f;
      border-color: #c1121f;
    }
    .form-control:focus {
      border-color: #e63946;
      box-shadow: 0 0 0 0.2rem rgba(230, 57, 70, 0.25);
    }
  </style>
</head>
<body>
  <div class="top-logo">
    <img src="/kainos_logo.jpg" alt="Kainos Logo">
  </div>
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
          <h1 class="app-title h3">Performance Testing Demo App</h1>
        </div>
        <div class="card login-card border-0">
          <div class="card-body p-4">
            <h5 class="card-title text-center mb-4">Sign In</h5>
            <div id="error" class="alert alert-danger py-2" style="display:none;"></div>
            <form id="loginForm">
              <input type="hidden" id="csrfToken" name="csrfToken" value="">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter username" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
            </form>
            <p class="text-center mt-3 mb-0">
              Don't have an account? <a href="/register" class="text-decoration-none">Create one</a>
            </p>
          </div>
        </div>
    </div>
  </div>
  <script src="/app.js"></script>
  <script>
    redirectIfLoggedIn();

    let csrfToken = '';

    async function fetchCsrfToken() {
      try {
        const res = await fetch('/api/auth/csrf');
        const data = await res.json();
        csrfToken = data.csrfToken;
        document.getElementById('csrfToken').value = csrfToken;
      } catch (err) {
        console.error('Failed to fetch CSRF token');
      }
    }
    fetchCsrfToken();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError('error');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password, csrfToken }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError('error', data.message);
          fetchCsrfToken();
          return;
        }

        saveAuth(data.token, data.user);
        window.location.href = '/tasks';
      } catch (err) {
        showError('error', 'Failed to connect to server');
      }
    });
  </script>
</body>
</html>
