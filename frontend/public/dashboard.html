<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - Task Manager</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-page">
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Task Manager</h1>
        <div class="user-info">
          <span id="userName">User</span>
          <p id="userEmail" class="user-email"></p>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <ul>
          <li><a href="#" class="nav-item active" data-filter="all">All Tasks</a></li>
          <li><a href="#" class="nav-item" data-filter="pending">Pending</a></li>
          <li><a href="#" class="nav-item" data-filter="in-progress">In Progress</a></li>
          <li><a href="#" class="nav-item" data-filter="completed">Completed</a></li>
        </ul>
      </nav>
      
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
      </div>
    </aside>
    
    <!-- Main Content -->
    <main class="main-content">
      <header class="dashboard-header">
        <h2>Tasks</h2>
        <button id="newTaskBtn" class="btn btn-primary">+ New Task</button>
      </header>
      
      <!-- Search and Filter -->
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search tasks...">
        <select id="priorityFilter">
          <option value="">All Priorities</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      
      <!-- Task List -->
      <div class="task-list" id="taskList">
        <p class="loading">Loading tasks...</p>
      </div>
    </main>
  </div>
  
  <!-- New/Edit Task Modal -->
  <div id="taskModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Create New Task</h2>
        <button class="modal-close">&times;</button>
      </div>
      
      <form id="taskForm" class="task-form">
        <div class="form-group">
          <label for="taskTitle">Title</label>
          <input type="text" id="taskTitle" required>
        </div>
        
        <div class="form-group">
          <label for="taskDesc">Description</label>
          <textarea id="taskDesc" rows="4"></textarea>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="taskDue">Due Date</label>
            <input type="date" id="taskDue">
          </div>
        </div>
        
        <div class="form-group">
          <label for="taskStatus">Status</label>
          <select id="taskStatus">
            <option value="pending" selected>Pending</option>
            <option value="in-progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary modal-close-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
