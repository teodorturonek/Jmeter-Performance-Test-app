<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager - Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <h1>Task Manager</h1>
      <p class="subtitle">JMeter Performance Testing Training App</p>
      
      <div class="form-section">
        <h2 id="formTitle">Login</h2>
        
        <form id="authForm" class="auth-form">
          <!-- Login inputs -->
          <div id="loginInputs">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
          
          <!-- Register inputs (hidden by default) -->
          <div id="registerInputs" style="display: none;">
            <div class="form-group">
              <label for="regName">Full Name</label>
              <input type="text" id="regName" name="name" required>
            </div>
            
            <div class="form-group">
              <label for="regEmail">Email Address</label>
              <input type="email" id="regEmail" name="email" required>
            </div>
            
            <div class="form-group">
              <label for="regPassword">Password</label>
              <input type="password" id="regPassword" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Register</button>
          </div>
        </form>
        
        <div class="form-toggle">
          <span id="toggleText">Don't have an account?</span>
          <button id="toggleBtn" class="btn-link">Sign up</button>
        </div>
      </div>
      
      <!-- Demo credentials -->
      <div class="demo-section">
        <p class="demo-title">Demo Credentials:</p>
        <div class="demo-cred">
          <strong>User 1:</strong> alice@example.com / password123
        </div>
        <div class="demo-cred">
          <strong>User 2:</strong> bob@example.com / password456
        </div>
      </div>
    </div>
  </div>
  
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
