server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Frontend pages
    location = / {
        try_files /index.html =404;
    }

    location = /register {
        try_files /register.html =404;
    }

    location = /tasks {
        try_files /tasks.html =404;
    }

    location = /tasks/new {
        try_files /tasks-new.html =404;
    }

    location ~ ^/tasks/\d+/edit$ {
        try_files /tasks-edit.html =404;
    }

    # Proxy API and utility routes to backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}
